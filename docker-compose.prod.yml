# Production Air-Gapped Stack — Manufacturing AI Platform
# Single-server deployment suitable for factory floor (no internet required after image pull)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required .env file: see .env.example (copy and fill in)
# Run DB init:  docker compose -f docker-compose.prod.yml exec postgres psql -U postgres -d manufacturing_ai -f /docker-entrypoint-initdb.d/init.sql

version: "3.9"

# ─── Shared Networks ──────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true          # no external internet access on this network
  proxy:
    driver: bridge

# ─── Persistent Volumes ───────────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  qdrant_data:
  nginx_certs:
  app_cache:

services:

  # ══════════════════════════════════════════════════════════════
  # NGINX REVERSE PROXY + SSL TERMINATION
  # ══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: mfg-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_certs:/etc/nginx/certs
    networks: [proxy, internal]
    depends_on: [app]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ══════════════════════════════════════════════════════════════
  # NEXT.JS WEB APPLICATION
  # ══════════════════════════════════════════════════════════════
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mfg-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: ON_PREM
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/manufacturing_ai
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      LOCAL_LLM_URL: http://ollama:11434/v1
    volumes:
      - app_cache:/app/.next/cache
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ══════════════════════════════════════════════════════════════
  # POSTGRESQL + PGVECTOR (Primary DB + Vector Store)
  # ══════════════════════════════════════════════════════════════
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mfg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: manufacturing_ai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./scripts/db/phase3_schema.sql:/docker-entrypoint-initdb.d/02_phase3.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manufacturing_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c max_connections=200
        -c shared_buffers=512MB
        -c work_mem=16MB
        -c maintenance_work_mem=256MB
        -c effective_cache_size=2GB
        -c wal_level=replica
        -c max_wal_senders=3

  # ══════════════════════════════════════════════════════════════
  # MINIO — S3-Compatible Object Storage for Documents
  # ══════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: mfg-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - minio_data:/data
    networks: [internal]
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: mfg-minio-init
    networks: [internal]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-changeme};
        mc mb --ignore-existing local/manufacturing-docs;
        mc mb --ignore-existing local/model-artifacts;
        mc anonymous set none local/manufacturing-docs;
        echo 'MinIO buckets initialized';
      "

  # ══════════════════════════════════════════════════════════════
  # OLLAMA — Local LLM Inference (GPU-accelerated)
  # ══════════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: mfg-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [internal]
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "2"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    container_name: mfg-ollama-init
    networks: [internal]
    depends_on: [ollama]
    entrypoint: >
      /bin/sh -c "
        sleep 10;
        ollama pull ${OLLAMA_MODEL:-qwen2.5:7b};
        ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text};
        echo 'Ollama models ready';
      "
    environment:
      OLLAMA_HOST: http://ollama:11434

  # ══════════════════════════════════════════════════════════════
  # PROMETHEUS — Metrics Scraper
  # ══════════════════════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: mfg-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

  # ══════════════════════════════════════════════════════════════
  # GRAFANA — Dashboards
  # ══════════════════════════════════════════════════════════════
  grafana:
    image: grafana/grafana:12.0.2
    container_name: mfg-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal, proxy]
    depends_on: [prometheus]
    ports:
      - "3001:3000"

  # ══════════════════════════════════════════════════════════════
  # PGBACKUP — Automated daily PostgreSQL backups
  # ══════════════════════════════════════════════════════════════
  pgbackup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: mfg-pgbackup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: manufacturing_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "30"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "3"
    volumes:
      - ./backups/db:/backups
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
