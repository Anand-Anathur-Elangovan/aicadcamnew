version: "3.9"

# On-Premise Manufacturing AI Stack
# Start: docker-compose -f docker-compose.onprem.yml up -d
# Stop:  docker-compose -f docker-compose.onprem.yml down

networks:
  manufacturing-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  ollama_data:

services:
  # ─────────────────────────────────────────────────────
  # PostgreSQL 16 + pgvector extension
  # Vector storage + BM25 full-text + metadata
  # ─────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: manufacturing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manufacturing_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - manufacturing-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────
  # MinIO — S3-Compatible Local Object Storage
  # Web Console: http://localhost:9001
  # S3 API:      http://localhost:9000
  # ─────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: manufacturing_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - manufacturing-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─────────────────────────────────────────────────────
  # MinIO bucket initializer (one-shot setup)
  # ─────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: manufacturing_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - manufacturing-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/manufacturing-docs &&
        mc anonymous set none local/manufacturing-docs &&
        echo 'MinIO bucket ready'
      "
    restart: "no"

  # ─────────────────────────────────────────────────────
  # Ollama — Local LLM & Embedding Server
  # API: http://localhost:11434
  # Pull models after start:
  #   docker exec manufacturing_ollama ollama pull qwen2.5:72b
  #   docker exec manufacturing_ollama ollama pull bge-m3
  # ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: manufacturing_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - manufacturing-net
    # GPU support — uncomment for NVIDIA GPU acceleration
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────
  # Ollama Model Puller (one-shot — pulls required models)
  # Runs once after Ollama is healthy, then exits.
  # ─────────────────────────────────────────────────────
  ollama-init:
    image: curlimages/curl:latest
    container_name: manufacturing_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - manufacturing-net
    entrypoint: >
      /bin/sh -c "
        echo 'Pulling qwen2.5:7b (lightweight default — replace with 72b for production)...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"qwen2.5:7b\"}' &&
        echo 'Pulling bge-m3 embedding model...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"bge-m3\"}' &&
        echo 'Models ready'
      "
    restart: "no"

  # ─────────────────────────────────────────────────────
  # Qdrant — Optional alternative Vector DB
  # Uncomment to use Qdrant instead of pgvector
  # Dashboard: http://localhost:6333/dashboard
  # ─────────────────────────────────────────────────────
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: manufacturing_qdrant
  #   restart: unless-stopped
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   networks:
  #     - manufacturing-net
